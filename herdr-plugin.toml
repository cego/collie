id = "cego.collie"
name = "Collie"
version = "0.1.0"
min_herdr_version = "0.7.5"
description = "Pick and run codified agent workflows (plan, implement, review) as multi-tab orchestrations."
platforms = ["linux", "macos"]

[[build]]
command = ["sh", "install.sh"]

[[actions]]
id = "pick"
title = "Run a workflow"
contexts = ["global", "workspace", "pane"]
command = ["bin/collie", "herdr", "pick"]

[[actions]]
id = "resume"
title = "Resume a workflow run"
contexts = ["global", "workspace"]
command = ["bin/collie", "herdr", "resume"]

[[actions]]
id = "fork"
title = "Fork a workflow or persona"
contexts = ["global", "workspace"]
command = ["bin/collie", "herdr", "fork"]

[[panes]]
id = "picker"
title = "Pick a Workflow"
placement = "popup"
width = "70%"
height = "60%"
command = ["sh", "-c", 'exec "$HERDR_PLUGIN_ROOT/bin/collie" herdr picker']

# One per workspace, and the only pane this plugin keeps open: the Control Plane.
# A run itself is driven by a detached `drive` process with no pane of its own.
[[panes]]
id = "workspace"
title = "Control Plane"
placement = "tab"
command = ["sh", "-c", 'exec "$HERDR_PLUGIN_ROOT/bin/collie" herdr workspace']
