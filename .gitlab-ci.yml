# Tag a version to publish the runner binaries the manifest's build step fetches.
stages: [test, build, release]

default:
  image: oven/bun:1.4

# The contract check needs no herdr server: `herdr api schema --json` prints the
# schema the binary bundles.
.contract:
  stage: test
  script:
    - bun install --frozen-lockfile
    - bun run tools/herdr-schema.ts $CHANNEL --out /tmp/herdr-schema.json
    - HERDR_API_SCHEMA=/tmp/herdr-schema.json bun test test/herdr-contract.test.ts

test:
  stage: test
  cache:
    key: test-timings
    paths: [.scratch/test-timings.json]
  script:
    - bun install --frozen-lockfile
    # The same script contributors run, so the local gate and CI cannot drift.
    - bun run check
    # `bun test` runs the sources; this runs the thing that actually ships, so a
    # broken compiled entrypoint or JSON envelope cannot pass CI.
    - bun run build
    - bun run smoke
    # Proves the committed snapshot is what the pinned herdr really prints, so the
    # snapshot cannot drift away from the pin it claims to come from.
    - bun run contract:check

# herdr releases often and Collie is meant to run on the newest one, so the drift check
# is a schedule rather than a gate on every merge request: an unrelated MR must not go
# red because herdr shipped.
contract:stable:
  extends: .contract
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  variables:
    CHANNEL: stable

# Weeks of warning about a coming break, and never a reason to stop anything.
contract:preview:
  extends: .contract
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  variables:
    CHANNEL: preview
  allow_failure: true

build:
  stage: build
  rules:
    - if: $CI_COMMIT_TAG
  parallel:
    matrix:
      - TARGET: [linux-x64, linux-arm64, darwin-x64, darwin-arm64]
  script:
    # `--os`/`--cpu` because `@opentui/core` ships its renderer as a per-platform
    # optional package and a plain install brings only this runner's. Cross-compiling
    # four targets from one glibc runner needs all four present at build time.
    - bun install --frozen-lockfile --os='*' --cpu='*'
    # The build script gates on the artifact embedding its own target's renderer and
    # deletes it otherwise, so a cross-build that resolved the wrong native package
    # fails the job rather than shipping a binary that dies on someone's mac.
    - bun run tools/build.ts $TARGET collie-$TARGET
    # Only the runner's own target can be executed here; the others are smoked by the
    # test stage's native build. Nothing is uploaded until this passes.
    - |
      if [ "$TARGET" = "linux-x64" ]; then
        sh tools/smoke.sh "./collie-$TARGET"
      fi
    - |
      curl --fail --silent --show-error \
        --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        --upload-file collie-$TARGET \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/collie/${CI_COMMIT_TAG}/collie-$TARGET"
  artifacts:
    paths: [collie-*]
    expire_in: 1 week

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  script: ["echo publishing $CI_COMMIT_TAG"]
  release:
    tag_name: $CI_COMMIT_TAG
    description: "Collie $CI_COMMIT_TAG"
    assets:
      links:
        - name: collie-linux-x64
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/collie/${CI_COMMIT_TAG}/collie-linux-x64"
          filepath: /collie-linux-x64
        - name: collie-linux-arm64
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/collie/${CI_COMMIT_TAG}/collie-linux-arm64"
          filepath: /collie-linux-arm64
        - name: collie-darwin-x64
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/collie/${CI_COMMIT_TAG}/collie-darwin-x64"
          filepath: /collie-darwin-x64
        - name: collie-darwin-arm64
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/collie/${CI_COMMIT_TAG}/collie-darwin-arm64"
          filepath: /collie-darwin-arm64
