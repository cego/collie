[package]
name = "ghostty-sys"
version = "0.0.0"
description = "Generated bindings to libghostty-vt, built from vendor/ghostty"
edition.workspace = true
license = "MIT AND Apache-2.0"
publish.workspace = true
links = "ghostty-vt"

[build-dependencies]
# Formatting uses rustfmt; the unused prettyplease feature mixes syn 2 and 3.
bindgen = { version = "0.73", default-features = false, features = ["logging", "runtime"] }
