[package]
name = "collie-desktop-chat"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
collie-desktop-protocol = { path = "../protocol" }
serde.workspace = true
serde_json.workspace = true
rune.workspace = true
rune-kit = { workspace = true, features = ["mermaid"] }
pulldown-cmark = { version = "0.13", default-features = false }
regex = "1"
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "6", default-features = false, features = ["tokio", "proxy"] }
tokio = { version = "1", features = ["rt", "time"] }
futures-util = { version = "0.3", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
rfd = { version = "0.17", default-features = false }
