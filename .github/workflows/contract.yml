# herdr releases often and Collie is meant to run on the newest one, so the drift check is
# a schedule rather than a gate on every pull request: an unrelated PR must not go red
# because herdr shipped. The contract check needs no herdr server: `herdr api schema --json`
# prints the schema the binary bundles.
name: contract
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

env:
  BUN_VERSION: "1.4.2"

jobs:
  contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, preview]
    # Preview is weeks of warning about a coming break, and never a reason to stop anything.
    continue-on-error: ${{ matrix.channel == 'preview' }}
    steps:
      # Shell rather than actions/checkout and setup-bun, for the reason ci.yml gives.
      - name: Check out this commit
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/$GITHUB_REPOSITORY"
          git fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
      - name: Install bun
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v$BUN_VERSION"
          echo "$HOME/.bun/bin" >>"$GITHUB_PATH"
      - run: bun install --frozen-lockfile
      - run: bun run tools/herdr-schema.ts ${{ matrix.channel }} --out /tmp/herdr-schema.json
      - run: HERDR_API_SCHEMA=/tmp/herdr-schema.json bun test test/herdr-contract.test.ts
