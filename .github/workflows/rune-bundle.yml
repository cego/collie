# The Rune spike's bundle (desktop-rune/README.md), built, signed and checked as Desktop's
# release builds Desktop, and kept as a workflow artefact. No release publishes it.

name: rune-bundle

on:
  workflow_dispatch:
  pull_request:
    paths:
      - desktop-rune/**
      - desktop/src/bun/**
      - .github/workflows/rune-bundle.yml

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libclang-dev
      # libghostty-vt builds with the Zig desktop-rune/README.md pins.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: rustup toolchain install
        working-directory: desktop-rune
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - run: bun install --frozen-lockfile
      - run: bun run desktop-rune/scripts/bundle.ts
      - run: du -sh desktop-rune/dist/build/*/* desktop-rune/dist/artifacts/* | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: collie-desktop-rune-linux
          path: desktop-rune/dist/artifacts/*
          if-no-files-found: error

  # Signed with the Developer ID and notarised only where the Apple secrets are set; ad hoc
  # otherwise, as the release's desktop-macos job.
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: rustup toolchain install
        working-directory: desktop-rune
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - run: bun install --frozen-lockfile
      - run: |
          [ -n "$CERTIFICATE" ] || exit 0
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "" "$RUNNER_TEMP/signing.keychain-db"
          security set-keychain-settings "$RUNNER_TEMP/signing.keychain-db"
          security unlock-keychain -p "" "$RUNNER_TEMP/signing.keychain-db"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$RUNNER_TEMP/signing.keychain-db" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "" "$RUNNER_TEMP/signing.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/signing.keychain-db" $(security list-keychains -d user | tr -d '"')
        env:
          CERTIFICATE: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
      - run: |
          [ -n "$API_KEY" ] || exit 0
          printf '%s\n' "$API_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          echo "ELECTROBUN_APPLEAPIKEYPATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
        env:
          API_KEY: ${{ secrets.APPLE_API_KEY_P8 }}
      - run: bun run desktop-rune/scripts/bundle.ts
        env:
          ELECTROBUN_DEVELOPER_ID: ${{ secrets.ELECTROBUN_DEVELOPER_ID || '-' }}
          ELECTROBUN_APPLEID: ${{ secrets.ELECTROBUN_APPLEID }}
          ELECTROBUN_APPLEIDPASS: ${{ secrets.ELECTROBUN_APPLEIDPASS }}
          ELECTROBUN_TEAMID: ${{ secrets.ELECTROBUN_TEAMID }}
          ELECTROBUN_APPLEAPIKEY: ${{ secrets.ELECTROBUN_APPLEAPIKEY }}
          ELECTROBUN_APPLEAPIISSUER: ${{ secrets.ELECTROBUN_APPLEAPIISSUER }}
      - run: sh tools/verify-mac-app.sh desktop-rune/dist
      - run: du -sh desktop-rune/dist/build/*/* desktop-rune/dist/artifacts/* | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: collie-desktop-rune-macos
          path: desktop-rune/dist/artifacts/*
          if-no-files-found: error
