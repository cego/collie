# The same gate on every push and pull request: the script contributors run, then the
# thing that actually ships.
name: ci
on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      # A rolling key: a fixed one would never save the timings back after the first run.
      - uses: actions/cache@v6
        with:
          path: .scratch/test-timings.json
          key: test-timings-${{ github.run_id }}
          restore-keys: test-timings-
      - run: bun install --frozen-lockfile
      # The same script contributors run, so the local gate and CI cannot drift.
      - run: bun run check
      # `bun test` runs the sources; this runs the compiled entrypoint and JSON envelope.
      - run: bun run build
      - run: bun run smoke
      # Proves the committed snapshot is what the pinned herdr really prints.
      - run: bun run contract:check

  # The runner built and smoked on a Mac, and the installers' signature check run with the
  # Mac's own LibreSSL. Not the whole suite: a Mac-only defect past these is when to add it.
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run smoke
      - run: bun test test/install-desktop.test.ts
        env:
          COLLIE_OPENSSL: /usr/bin/openssl
      - run: bun test test/prepare.test.ts -t "release key|another key signed|cannot be fetched|LibreSSL|no openssl"
        env:
          COLLIE_OPENSSL: /usr/bin/openssl

  # Desktop built for Apple silicon, signed ad hoc, and the gate the release runs on its bundles.
  desktop-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: desktop
      - run: bun run build
        working-directory: desktop
        env:
          ELECTROBUN_DEVELOPER_ID: "-"
      - run: sh tools/verify-mac-app.sh desktop
      - run: ls desktop/artifacts

  # Desktop's own install and types, which the root check cannot see: the root installs none
  # of Desktop's dependencies.
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      # Desktop's Effect is the root's, so the board's Schemas exist once.
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: desktop
      - run: bun run typecheck
        working-directory: desktop
      # The release builds the view on a fresh checkout, so CI does too.
      - run: bun run view
        working-directory: desktop
