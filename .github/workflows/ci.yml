# The same gate on every push and pull request: the script contributors run, then the
# thing that actually ships.
#
# No marketplace actions anywhere in here. Every one of them is a JavaScript bundle the
# runner executes with its own Node, which is a second runtime in a repository that has
# one — and GitHub keeps moving that Node underneath us. `git`, `curl` and `gh` are on
# the image already, so the checkout, the toolchain and the release are shell.
name: ci
on:
  push:
    branches: [master]
  pull_request:

env:
  # Pinned, and the same line in every workflow: the installer takes an exact release,
  # and "whatever bun published this morning" is not a thing to find out from a red PR.
  BUN_VERSION: "1.4.2"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this commit
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/$GITHUB_REPOSITORY"
          # By sha rather than by branch: this is the commit the run was triggered for,
          # and on a pull request the branch has already moved on often enough.
          git fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
      - name: Install bun
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v$BUN_VERSION"
          echo "$HOME/.bun/bin" >>"$GITHUB_PATH"
      - run: bun install --frozen-lockfile
      # The same script contributors run, so the local gate and CI cannot drift.
      - run: bun run check
      # `bun test` runs the sources; this runs the compiled entrypoint and JSON envelope.
      - run: bun run build
      - run: bun run smoke
      # Proves the committed snapshot is what the pinned herdr really prints.
      - run: bun run contract:check
