# The same gate on every push and pull request: the script contributors run, then the
# thing that actually ships.
name: ci
on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - run: bun install --frozen-lockfile
      - run: bun run check:static
      # `bun test` runs the sources; this runs the compiled entrypoint and JSON envelope.
      - run: bun run build
      - run: bun run smoke
      # Proves the committed snapshot is what the pinned herdr really prints.
      - run: bun run contract:check
      # The decoders in src/hc.ts against the hc that hc-pin.json names, run live.
      - run: bun run probe:hc

  # No timings cache: every shard balances on the committed seed, so they partition alike.
  suite:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - run: bun install --frozen-lockfile
      - run: bun run test --shard=${{ matrix.shard }}/3
        # 4 workers: a dedicated runner needs no reserve for targeted runs (budget ADR, D2).
        env:
          COLLIE_TEST_BUDGET: 6
      - uses: actions/upload-artifact@v7
        with:
          name: test-timings-shard-${{ matrix.shard }}
          path: .scratch/test-timings.json
          include-hidden-files: true

  # The required check. Never skipped, which a required check would read as passing.
  test:
    needs: [static, suite, desktop, desktop-rune, desktop-native]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "static: ${{ needs.static.result }}, suite: ${{ needs.suite.result }}"
          test "${{ needs.static.result }}" = success && test "${{ needs.suite.result }}" = success
          test "${{ needs.desktop.result }}" = success
          test "${{ needs.desktop-rune.result }}" = success
          test "${{ needs.desktop-native.result }}" = success

  # The runner built and smoked on a Mac, and the installers' signature check run with the
  # Mac's own LibreSSL. Not the whole suite: a Mac-only defect past these is when to add it.
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run smoke
      - run: bun test test/install-desktop.test.ts
        env:
          COLLIE_OPENSSL: /usr/bin/openssl
      - run: bun test test/prepare.test.ts -t "release key|another key signed|cannot be fetched|LibreSSL|no openssl"
        env:
          COLLIE_OPENSSL: /usr/bin/openssl

  desktop-native:
    uses: ./.github/workflows/rune-bundle.yml

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      # Desktop's Effect is the root's, so the board's Schemas exist once.
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
        working-directory: desktop

  # The native view tests draw on lavapipe, Mesa's software Vulkan. libghostty-vt builds from the
  # vendor/ghostty submodule with the Zig it pins, and bindgen needs libclang.
  desktop-rune:
    runs-on: ubuntu-latest
    env:
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev mesa-vulkan-drivers libclang-dev
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      # Installs the toolchain desktop-rune/rust-toolchain.toml pins.
      - run: rustup toolchain install
        working-directory: desktop-rune
      - run: cargo fmt --all --check
        working-directory: desktop-rune
      - run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: desktop-rune
      # protocol/tests/core.rs starts Desktop's main process under Bun.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - run: bun install --frozen-lockfile
      - run: cargo test --workspace
        working-directory: desktop-rune
      - run: bun test test/rune-contract.test.ts test/rune-types.test.ts test/rune-shell.test.ts
