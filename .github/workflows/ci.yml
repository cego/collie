# The same gate on every push, pull request and merge group: the script contributors run,
# then the thing that actually ships.
name: ci
on:
  push:
    branches: [master]
  pull_request:
  merge_group:
    types: [checks_requested]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4"
      - run: bun install --frozen-lockfile
      - run: bun run check:static
      # `bun test` runs the sources; this runs the compiled entrypoint and JSON envelope.
      - run: bun run build
      - run: bun run smoke
      # Proves the committed snapshot is what the pinned herdr really prints.
      - run: bun run contract:check
      # The decoders in src/hc.ts against the hc that hc-pin.json names, run live.
      - run: bun run probe:hc

  # No timings cache: every shard balances on the committed seed, so they partition alike.
  suite:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-alsa gstreamer1.0-libav
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4"
      - run: bun install --frozen-lockfile
      - run: bun run test --shard=${{ matrix.shard }}/${{ strategy.job-total }}
        # 4 workers: a dedicated runner needs no reserve for targeted runs (budget ADR, D2).
        env:
          COLLIE_TEST_BUDGET: 6
      - uses: actions/upload-artifact@v7
        with:
          name: test-timings-shard-${{ matrix.shard }}
          path: .scratch/test-timings.json
          include-hidden-files: true

  # The required check. Never skipped, which a required check would read as passing.
  test:
    needs: [static, suite, macos, desktop-checks, desktop-bundle]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "static: ${{ needs.static.result }}, suite: ${{ needs.suite.result }}"
          test "${{ needs.static.result }}" = success
          test "${{ needs.suite.result }}" = success
          test "${{ needs.macos.result }}" = success
          test "${{ needs.desktop-checks.result }}" = success
          test "${{ needs.desktop-bundle.result }}" = success

  # The runner built and smoked on a Mac, and the installers' signature check run with the
  # Mac's own LibreSSL. Not the whole suite: a Mac-only defect past these is when to add it.
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run smoke
      - run: bun test test/install-desktop.test.ts
        env:
          COLLIE_OPENSSL: /usr/bin/openssl
      - run: bun test test/prepare.test.ts -t "release key|another key signed|cannot be fetched|LibreSSL|no openssl"
        env:
          COLLIE_OPENSSL: /usr/bin/openssl

  desktop-bundle:
    uses: ./.github/workflows/rune-bundle.yml

  # The native view tests draw on lavapipe, Mesa's software Vulkan. libghostty-vt builds from the
  # vendor/ghostty submodule with the Zig it pins, and bindgen needs libclang.
  desktop-checks:
    runs-on: ubuntu-latest
    env:
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      # The terminal's wide-glyph test exercises a real system CJK fallback.
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev mesa-vulkan-drivers libclang-dev fontconfig fonts-noto-cjk libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-alsa gstreamer1.0-libav
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4"
      # Desktop's Effect is the root's, so the board's Schemas exist once.
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
        working-directory: desktop
      # Installs the toolchain desktop/rust-toolchain.toml pins.
      - run: rustup toolchain install
        working-directory: desktop
      # Cache compiler inputs and dependencies; Cargo still checks and runs every target.
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          workspaces: desktop
          shared-key: desktop
      - run: cargo fmt --all --check
        working-directory: desktop
      - run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: desktop
      # protocol/tests/core.rs starts Desktop's main process under Bun.
      - run: cargo test --workspace
        working-directory: desktop
      - run: bun test test/rune-contract.test.ts test/rune-types.test.ts test/rune-shell.test.ts test/rune-media.test.ts
