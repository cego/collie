# Tag a version (no `v`: install.sh builds the download URL from the version in
# herdr-plugin.toml verbatim) to publish the runner binaries install.sh fetches, and
# Collie Desktop at the same version: its installer, its update files and install-desktop.sh.
name: release
on:
  push:
    tags: ["*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [linux-x64, linux-arm64, darwin-x64, darwin-arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      # `--os`/`--cpu` because `@opentui/core` ships its renderer as a per-platform
      # optional package and a plain install brings only this runner's. Cross-compiling
      # four targets from one glibc runner needs all four present at build time.
      - run: bun install --frozen-lockfile --os='*' --cpu='*'
      # The build script gates on the artifact embedding its own target's renderer, so a
      # cross-build that resolved the wrong native package fails here rather than shipping.
      - run: bun run tools/build.ts ${{ matrix.target }} collie-${{ matrix.target }}
      # Only the runner's own target can be executed here; the others are smoked by ci.yml's
      # native build.
      - if: matrix.target == 'linux-x64'
        run: sh tools/smoke.sh ./collie-${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: collie-${{ matrix.target }}
          path: collie-${{ matrix.target }}

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      # Desktop's Effect is the root's, so the board's Schemas exist once.
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: desktop
      # The stable channel, the only one that updates itself, under herdr-plugin.toml's version.
      - run: bun run build
        working-directory: desktop
      # Electrobun's self-extractor cannot read a path over 100 characters, so an installer
      # with one is never published.
      - run: |
          tar -xzf desktop/artifacts/linux-x64-collie-desktop-Setup.tar.gz -C "$RUNNER_TEMP" ./installer
          bun run tools/check-payload.ts "$RUNNER_TEMP/installer"
      - uses: actions/upload-artifact@v7
        with:
          name: collie-desktop
          path: desktop/artifacts/*
          if-no-files-found: error

  release:
    needs: [build, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      # Signed after the build matrix, in the one job that holds the secret.
      - uses: actions/checkout@v7
        with:
          path: repo
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - run: bun install --frozen-lockfile
        working-directory: repo
      - run: cp repo/install-desktop.sh .
      # Desktop's installer, its update archive (also as the tar it is applied as, which is
      # what Desktop verifies) and its update manifest, beside the runners.
      - run: bun run tools/sign.ts ../collie-* ../*-collie-desktop* ../*-update.json ../install-desktop.sh
        working-directory: repo
        env:
          COLLIE_SIGNING_KEY: ${{ secrets.COLLIE_SIGNING_KEY }}
      # The newest release is the one Desktop's updater and install-desktop.sh read, through
      # `releases/latest/download`.
      # A delta patch exists only once there is a release before this one.
      - run: |
          shopt -s nullglob
          gh release create "$GITHUB_REF_NAME" collie-* *-collie-desktop* *-update.json* *.patch install-desktop.sh* --repo "$GITHUB_REPOSITORY" --title "Collie $GITHUB_REF_NAME" --notes "Collie $GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
